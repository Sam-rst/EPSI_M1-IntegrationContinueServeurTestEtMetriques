server {
    listen 80;

    # Les appels /api/* sont proxyfiés vers le service back (nom "back" du réseau Docker).
    # Le slash final réécrit /api/convert -> /convert côté back.
    location /api/ {
        proxy_pass http://back:8000/;
    }

    # SPA : on sert les fichiers statiques, fallback sur index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
