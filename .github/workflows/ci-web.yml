name: CI · web

# CI réutilisable du service front : appelée par l'orchestrateur ci.yml
# (et par cd-web.yml). Ne se déclenche pas seule.
on:
  workflow_call:

# Toutes les commandes `run` s'exécutent dans apps/web.
defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: ⚛️ quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format
      - name: typecheck
        run: npm run typecheck
      - name: deadcode
        run: npm run deadcode

  security:
    name: ⚛️ security
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: audit:deps
        run: npm run audit:deps
      - name: audit:code
        run: npm run audit:code

  tests:
    name: ⚛️ tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: tests:unit
        run: npm run tests:unit
      - name: tests:integ
        run: npm run tests:integ

  build:
    name: ⚛️ build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: build (le bundle compile ?)
        run: npm run build
      - name: build image docker (l'infra se build ?)
        run: docker build -t converter-front:ci .
