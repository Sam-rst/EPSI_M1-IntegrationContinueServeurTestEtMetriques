name: CI · api

# CI réutilisable du service back : appelée par l'orchestrateur ci.yml
# (et par cd-api.yml). Ne se déclenche pas seule.
on:
  workflow_call:

# Toutes les commandes `run` s'exécutent dans apps/api.
defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: 🐍 quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: lint
        run: uv run poe lint
      - name: format
        run: uv run poe format
      - name: typecheck
        run: uv run poe typecheck
      - name: deadcode
        run: uv run poe deadcode

  security:
    name: 🐍 security
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: audit:deps
        run: uv run poe audit:deps
      - name: audit:code
        run: uv run poe audit:code

  tests:
    name: 🐍 tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: tests:unit
        run: uv run poe tests:unit
      - name: tests:integ
        run: uv run poe tests:integ

  build:
    name: 🐍 build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - name: build (le code compile ?)
        run: uv run poe build
      - name: build image docker (l'infra se build ?)
        run: docker build -t converter-back:ci .
